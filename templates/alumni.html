<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Alumni Directory — Alumni Setu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body class="text-slate-800 bg-slate-50">

  <!-- Header -->
  <header class="sticky top-0 bg-white/80 backdrop-blur-md z-40 border-b border-slate-200">
    <nav class="container mx-auto px-4 lg:px-8 py-4 flex justify-between items-center">
      <a href="/" class="flex items-center space-x-3">
        <img src="{{ url_for('static', filename='1.png') }}" alt="Logo" width="80" class="rounded-full"/>
        <span class="font-bold text-2xl text-slate-800 font-display">Alumni Setu</span>
      </a>
      <div class="hidden md:flex items-center space-x-6">
        <a href="/" class="text-slate-600 hover:text-indigo-500 transition">Home</a>
        <a href="/alumni" class="text-indigo-600 hover:text-indigo-500 transition">Alumni Directory</a>
        <a href="/jobs" class="text-slate-600 hover:text-indigo-500 transition">Job Board</a>
        <a href="/events" class="text-slate-600 hover:text-indigo-500 transition">Events</a>
        <a href="/messaging" class="text-slate-600 hover:text-indigo-500 transition">Messages</a>
        <a href="/mentorship" class="text-slate-600 hover:text-indigo-500 transition">Mentorship</a>
      </div>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="container mx-auto px-4 lg:px-8 py-16">
    <div class="text-center mb-12">
      <h1 class="text-4xl font-bold text-slate-900">Alumni Directory</h1>
      <p class="mt-4 text-lg text-slate-600">Connect by browsing profiles filtered by graduation year, department, or location.</p>
    </div>

    <!-- Filters -->
    <div class="mb-8 grid grid-cols-1 md:grid-cols-5 gap-4">
      <input id="search-name" type="text" placeholder="Name" class="px-4 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
      <select id="filter-year" class="px-4 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <option value="">Year</option>
        <option>2018</option>
        <option>2019</option>
        <option>2020</option>
        <option>2021</option>
        <option>2022</option>
        <option>2023</option>
      </select>
      <select id="filter-dept" class="px-4 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <option value="">Department</option>
        <option>Computer Science</option>
        <option>Business</option>
        <option>Engineering</option>
        <option>Civil Engineering</option>
        <option>Electrical Engineering</option>
        <option>Electronics</option>
      </select>
      <input id="filter-location" type="text" placeholder="Location" class="px-4 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
      <button id="alumni-search-btn" class="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition">Search</button>
    </div>

    <!-- Alumni Cards -->
    <div id="alumni-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
  </main>

  <!-- Footer -->
  <footer class="bg-slate-900 text-slate-400">
    <div class="container mx-auto px-4 lg:px-8 py-6 text-center">
      <p>&copy; 2025 Alumni Setu. All rights reserved.</p>
    </div>
  </footer>

  <!-- Alumni Directory Script -->
  <script>
    document.getElementById('alumni-search-btn').addEventListener('click', renderAlumni);
    window.addEventListener('DOMContentLoaded', renderAlumni);

    function renderAlumni() {
      const nameQ = document.getElementById('search-name').value.trim().toLowerCase();
      const yearF = document.getElementById('filter-year').value;
      const deptF = document.getElementById('filter-dept').value;
      const locF = document.getElementById('filter-location').value.trim().toLowerCase();
      const container = document.getElementById('alumni-container');
      container.innerHTML = '';

      const alumni = [
        { name:'Anamika Chauhan', year:'2021', dept:'Computer Science', position:'Software Developer',  company:'InnovateTech',    location:'Bangalore', skills:['Python','Django'] },
        { name:'Rahul Mehta', year:'2020', dept:'Business',          position:'Business Analyst', company:'MarketGenius',  location:'Mumbai',    skills:['Excel','Power BI'] },
        { name:'Sara Lee',   year:'2022', dept:'Engineering',       position:'Project Manager',  company:'BuildIt Corp',   location:'Chennai',   skills:['Agile','Scrum'] },
        { name:'Vikram Patel',year:'2019', dept:'Mechanical Engineering',position:'R&D Engineer',  company:'AutoMech',       location:'Pune',      skills:['CAD','Thermodynamics'] },
        { name:'Neha Sharma',year:'2023', dept:'Computer Science',   position:'Frontend Developer',company:'WebWorks',       location:'Hyderabad', skills:['React','Vue.js'] },
        { name:'Arjun Reddy',year:'2018', dept:'Electrical Engineering',position:'Power Engineer',  company:'GridPower',      location:'Delhi',     skills:['MATLAB','Simulink'] },
        { name:'Priyanka Das',year:'2021', dept:'Business',         position:'Marketing Manager',company:'BrandRise',      location:'Kolkata',   skills:['SEO','Content'] },
        { name:'Sanjeev Singh',year:'2022',dept:'Civil Engineering',position:'Structural Eng.',  company:'BuildSafe',      location:'Ahmedabad', skills:['STAAD','AutoCAD'] },
        { name:'Deepika Nair',year:'2020', dept:'Computer Science', position:'Data Scientist',  company:'DataSense AI',   location:'Bangalore', skills:['Python','ML'] },
        { name:'Manoj Varma',year:'2019', dept:'Electronics',       position:'Embedded Eng.',   company:'EmbedTech',      location:'Chennai',   skills:['C','ARM'] },
        { name:'Kavita Joshi',year:'2023', dept:'Business',         position:'Product Manager', company:'Innova',         location:'Mumbai',    skills:['Product','Analytics'] },
        { name:'Ravi Kumar', year:'2022', dept:'Engineering',       position:'Site Engineer',   company:'InfraWorks',     location:'Delhi',     skills:['Civil','Project'] },
        { name:'Anjali Rao', year:'2021', dept:'Computer Science',  position:'UI/UX Designer',  company:'DesignPro',      location:'Pune',      skills:['Figma','Sketch'] },
        { name:'Tarun Goel', year:'2018', dept:'Electrical Engineering',position:'Control Systems',company:'AutoGrid',       location:'Hyderabad', skills:['PLC','SCADA'] },
        { name:'Meera Kapoor',year:'2020', dept:'Computer Science',  position:'DevOps Engineer',  company:'CloudServe',     location:'Bangalore', skills:['AWS','Docker'] }
      ];

      const filtered = alumni.filter(a =>
        (!nameQ   || a.name.toLowerCase().includes(nameQ)) &&
        (!yearF   || a.year === yearF) &&
        (!deptF   || a.dept === deptF) &&
        (!locF    || a.location.toLowerCase().includes(locF))
      );

      (filtered.length ? filtered : alumni).forEach(a => {
        const card = document.createElement('div');
        card.className = 'bg-white rounded-lg shadow-md border border-slate-200 p-6';
        card.innerHTML = `
          <div class="flex items-center mb-4">
            <img src="{{ url_for('static', filename='2.png') }}" alt="Alumni" class="w-16 h-16 rounded-full mr-4"/>
            <div>
              <h2 class="text-xl font-semibold text-slate-900">${a.name}</h2>
              <p class="text-slate-600">${a.dept} ’${a.year.slice(-2)}</p>
            </div>
          </div>
          <p class="text-slate-600 mb-4">${a.position} at ${a.company}, ${a.location}</p>
          <div class="flex flex-wrap gap-2 mb-4">
            ${a.skills.map(skill => `<span class="px-2 py-1 bg-indigo-100 text-indigo-800 text-xs rounded-full">${skill}</span>`).join('')}
          </div>
          <a href="#" class="inline-block px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition">View Profile</a>
        `;
        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
