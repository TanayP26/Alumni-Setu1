<!-- Auth Modal -->
<div id="auth-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden items-center justify-center p-4">
    <div id="auth-card" class="bg-white rounded-2xl shadow-2xl w-full max-w-md relative overflow-hidden">
        <button id="close-modal-btn" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
            <i data-lucide="x" class="w-6 h-6"></i>
        </button>
        <!-- Login Form -->
        <div id="login-form-container" class="p-8 md:p-12">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-bold text-slate-900">Welcome Back</h2>
                <p class="text-slate-500 mt-1">Sign in to continue your journey.</p>
            </div>
            <form id="login-form">
                <div class="space-y-4">
                    <input type="email" name="email" placeholder="Email Address" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                    <input type="password" name="password" placeholder="Password" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                </div>
                <button type="submit" class="w-full mt-6 py-3 font-semibold rounded-lg text-white gradient-bg hover:opacity-90 transition">Login</button>
            </form>
            <p class="text-center text-sm text-slate-500 mt-6">
                Don't have an account? <button id="show-register-btn" class="font-semibold text-indigo-500 hover:underline">Sign up</button>
            </p>
        </div>
        <!-- Register Form -->
        <div id="register-form-container" class="p-8 md:p-12 hidden">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-bold text-slate-900">Join the Community</h2>
                <p class="text-slate-500 mt-1">Create your account to connect.</p>
            </div>
            <form id="register-form">
                <div class="space-y-3">
                    <input type="text" name="name" placeholder="Full Name" required class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                    <input type="email" name="email" placeholder="Email Address" required class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                    <input type="password" name="password" placeholder="Password (min. 6 characters)" required class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                </div>
                <button type="submit" class="w-full mt-6 py-3 font-semibold rounded-lg text-white gradient-bg hover:opacity-90 transition">Create Account</button>
            </form>
            <p class="text-center text-sm text-slate-500 mt-6">
                Already have an account? <button id="show-login-btn" class="font-semibold text-indigo-500 hover:underline">Log in</button>
            </p>
        </div>
    </div>
</div>
