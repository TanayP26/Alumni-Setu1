<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Messages — Alumni Setu</title>
  <script src="//cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.0/socket.io.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{{ url_for('static','style.css') }}"/>
</head>
<body class="text-slate-800 bg-slate-50">

  <!-- Header -->
  <header class="sticky top-0 bg-white/80 backdrop-blur-md z-40 border-b border-slate-200">
    <nav class="container mx-auto px-4 lg:px-8 py-4 flex justify-between items-center">
      <a href="/" class="flex items-center space-x-3">
        <img src="{{ url_for('static','1.png') }}" alt="Alumni Setu Logo" width="80" class="rounded-full"/>
        <span class="font-bold text-2xl text-slate-800 font-display">Alumni Setu</span>
      </a>
      <div class="hidden md:flex items-center space-x-6">
        <a href="/" class="text-slate-600 hover:text-indigo-500 transition">Home</a>
        <a href="/alumni" class="text-slate-600 hover:text-indigo-500 transition">Alumni Directory</a>
        <a href="/jobs" class="text-slate-600 hover:text-indigo-500 transition">Job Board</a>
        <a href="/events" class="text-slate-600 hover:text-indigo-500 transition">Events</a>
        <a href="/messaging" class="text-indigo-600 hover:text-indigo-500 transition">Messages</a>
        <a href="/mentorship" class="text-slate-600 hover:text-indigo-500 transition">Mentorship</a>
      </div>
      <div id="user-profile-section" class="flex items-center space-x-4">
        <a href="/profile" class="text-indigo-600 hover:text-indigo-500 transition">
          <i data-lucide="user"></i>
        </a>
        <button id="message-btn" class="text-slate-500 hover:text-indigo-500 transition">
          <i data-lucide="message-square"></i>
        </button>
        <div class="relative">
          <img id="profile-pic" src="{{ url_for('static','2.png') }}" alt="User Profile" class="rounded-full cursor-pointer w-8 h-8"/>
          <div id="profile-dropdown" class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 z-50 hidden">
            <a href="/profile" class="block px-4 py-2 text-sm text-slate-700 hover:bg-slate-100">My Profile</a>
            <a href="#" id="logout-btn" class="block w-full text-left px-4 py-2 text-sm text-slate-700 hover:bg-slate-100">Logout</a>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="container mx-auto px-4 lg:px-8 py-16">
    <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- Sidebar -->
      <div>
        <div class="bg-white rounded-xl p-6 shadow-lg border border-slate-100 mb-6">
          <h2 class="text-xl font-bold text-slate-900 mb-4">Messages</h2>
          <div class="space-y-2">
            <button id="inbox-btn" class="w-full text-left px-4 py-2 bg-indigo-100 text-indigo-800 rounded-lg">
              <i data-lucide="inbox" class="w-4 h-4 inline mr-2"></i>
              Inbox <span id="unread-badge" class="ml-2 bg-indigo-600 text-white px-2 py-1 text-xs rounded-full">0</span>
            </button>
            <button id="sent-btn" class="w-full text-left px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg">
              <i data-lucide="send" class="w-4 h-4 inline mr-2"></i>
              Sent
            </button>
          </div>
        </div>
        <button id="compose-btn" class="w-full px-6 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition flex items-center justify-center">
          <i data-lucide="plus" class="w-4 h-4 inline mr-2"></i>
          Compose Message
        </button>
      </div>

      <!-- Message List & View -->
      <div class="lg:col-span-2 space-y-6">
        <!-- List -->
        <div id="message-list" class="bg-white rounded-xl shadow-lg border border-slate-100">
          <div class="p-6 border-b border-slate-200">
            <h3 id="list-title" class="text-xl font-bold text-slate-900">Inbox</h3>
          </div>
          <div id="list-container" class="divide-y divide-slate-200"></div>
        </div>

        <!-- View -->
        <div id="message-view" class="hidden bg-white rounded-xl shadow-lg border border-slate-100">
          <div class="p-6 border-b border-slate-200 flex justify-between items-center">
            <button id="back-btn" class="text-slate-600 hover:text-slate-800 flex items-center">
              <i data-lucide="arrow-left" class="w-5 h-5 inline mr-2"></i> Back
            </button>
            <button id="delete-btn" class="text-red-600 hover:text-red-800">
              <i data-lucide="trash-2" class="w-5 h-5"></i>
            </button>
          </div>
          <div id="message-content" class="p-6"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- Compose Modal -->
  <div id="compose-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-xl p-8 w-full max-w-2xl mx-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-6">
        <h3 class="text-xl font-bold text-slate-900">Compose Message</h3>
        <button id="close-compose-btn" class="text-slate-600 hover:text-slate-800">
          <i data-lucide="x" class="w-6 h-6"></i>
        </button>
      </div>
      <form id="compose-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">To</label>
          <select id="recipient-select" class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500">
            <option value="">Select recipient...</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">Subject</label>
          <input type="text" id="subject-input" required class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">Message</label>
          <textarea id="content-input" rows="6" required class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500"></textarea>
        </div>
        <div class="flex justify-end space-x-4">
          <button type="button" id="cancel-compose-btn" class="px-6 py-2 border border-slate-300 rounded-lg text-slate-600 hover:bg-slate-50">Cancel</button>
          <button type="submit" class="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">Send Message</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white px-6 py-3 rounded-lg shadow-lg opacity-0 transition-opacity duration-300">
    <p id="toast-message">Something happened!</p>
  </div>

  <script>
    const socket = io({ auth: { token: localStorage.getItem('token') } });
    let currentView = 'inbox';
    let currentMsgId = null;

    function showToast(msg, type='success') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = `fixed bottom-5 right-5 px-6 py-3 rounded-lg shadow-lg transition-opacity duration-300 show bg-${type==='error'?'red':'green'}-500`;
      setTimeout(()=> t.classList.remove('show'), 3000);
    }

    socket.on('connect_error', ()=> showToast('Socket error','error'));
    socket.on('new_message', ()=> {
      if(currentView==='inbox') loadInbox();
      updateUnread();
    });

    async function fetchJSON(url, opts={}) {
      opts.headers = {...(opts.headers||{}), 'Authorization':`Bearer ${localStorage.getItem('token')}`};
      const r = await fetch(url, opts);
      if(!r.ok) throw await r.json();
      return r.json();
    }

    async function loadInbox() {
      currentView = 'inbox';
      document.getElementById('message-view').classList.add('hidden');
      const {messages} = await fetchJSON('/api/messaging/inbox');
      renderList(messages);
    }

    async function loadSent() {
      currentView = 'sent';
      document.getElementById('message-view').classList.add('hidden');
      const {messages} = await fetchJSON('/api/messaging/sent');
      renderList(messages);
    }

    function renderList(msgs) {
      const container = document.getElementById('list-container');
      document.getElementById('list-title').textContent = currentView==='inbox' ? 'Inbox' : 'Sent';
      container.innerHTML = msgs.map(m=>`
        <div class="p-4 bg-white rounded-lg mb-2 cursor-pointer" data-id="${m.id}">
          <div class="flex justify-between">
            <div>
              <strong>${currentView==='inbox'? m.sender_name : m.recipient_name}</strong>
              <div class="text-gray-500">${m.subject}</div>
            </div>
            <div class="text-sm text-gray-400">${new Date(m.timestamp).toLocaleDateString()}</div>
          </div>
        </div>`).join('');
      document.querySelectorAll('[data-id]').forEach(el=>
        el.onclick = ()=> viewMessage(el.dataset.id)
      );
    }

    async function viewMessage(id) {
      const {message} = await fetchJSON(`/api/messaging/${id}`);
      currentMsgId = id;
      document.getElementById('message-list').classList.add('hidden');
      const v = document.getElementById('message-view');
      v.innerHTML = `
        <div class="p-4 flex justify-between items-center border-b">
          <button id="back-btn" class="text-indigo-600"><i data-lucide="arrow-left"></i> Back</button>
          <button id="delete-btn" class="text-red-600"><i data-lucide="trash-2"></i></button>
        </div>
        <div class="p-6">
          <h3 class="font-bold text-xl mb-4">${message.subject}</h3>
          <p class="whitespace-pre-wrap">${message.content}</p>
        </div>`;
      v.classList.remove('hidden');
      document.getElementById('back-btn').onclick = ()=>{
        v.classList.add('hidden');
        document.getElementById('message-list').classList.remove('hidden');
        loadInbox();
      };
      document.getElementById('delete-btn').onclick = async ()=>{
        await fetchJSON(`/api/messaging/${currentMsgId}`, {method:'DELETE'});
        showToast('Deleted');
        document.getElementById('back-btn').click();
        if(currentView==='inbox') loadInbox(); else loadSent();
        updateUnread();
      };
    }

    async function updateUnread() {
      const {unread_count} = await fetchJSON('/api/messaging/unread-count');
      const b = document.getElementById('unread-badge');
      b.textContent = unread_count;
      b.style.display = unread_count?'inline':'none';
    }

    async function loadUsers() {
      const users = await fetchJSON('/api/auth/alumni-list');
      const sel = document.getElementById('recipient-select');
      sel.innerHTML = '<option value="">Select recipient...</option>' + users.map(u=>
        `<option value="${u.id}">${u.first_name} ${u.last_name}</option>`
      ).join('');
    }

    document.getElementById('inbox-btn').onclick = loadInbox;
    document.getElementById('sent-btn').onclick = loadSent;
    document.getElementById('compose-btn').onclick = ()=>{
      document.getElementById('compose-modal').classList.remove('hidden');
      loadUsers();
    };
    document.getElementById('cancel-compose-btn').onclick = ()=>{
      document.getElementById('compose-modal').classList.add('hidden');
    };

    document.getElementById('compose-form').onsubmit = async e=>{
      e.preventDefault();
      const rid = document.getElementById('recipient-select').value;
      if(!rid){ showToast('Select recipient','error'); return; }
      const subj = document.getElementById('subject-input').value;
      const cont = document.getElementById('content-input').value;
      await fetchJSON('/api/messaging/send', {
        method:'POST',
        body: JSON.stringify({recipient_id:rid, subject:subj, content:cont})
      });
      showToast('Message sent');
      document.getElementById('compose-modal').classList.add('hidden');
      if(currentView==='sent') loadSent();
    };

    document.addEventListener('DOMContentLoaded', ()=>{
      loadInbox();
      updateUnread();
    });

    if(window.lucide) lucide.createIcons();
  </script>

</body>
</html>
