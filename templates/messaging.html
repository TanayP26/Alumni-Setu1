{% extends "base.html" %}

{% block title %}Messages - Alumni Setu{% endblock %}

{% block content %}
<div class="container mx-auto px-4 lg:px-8 py-8 h-screen">
    <div class="bg-white rounded-lg shadow-lg h-full flex">
        <!-- Sidebar - Conversations List -->
        <div class="w-1/3 border-r border-slate-200 flex flex-col">
            <div class="p-6 border-b border-slate-200">
                <h2 class="text-2xl font-bold gradient-text">Messages</h2>
                <button id="new-message-btn" class="mt-4 w-full bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition">
                    <i data-lucide="plus" class="inline w-4 h-4 mr-2"></i>
                    New Message
                </button>
            </div>
            <div class="flex-1 overflow-y-auto">
                <div id="conversations-list">
                    <!-- Conversations will be loaded here -->
                </div>
            </div>
        </div>

        <!-- Main Chat Area -->
        <div class="flex-1 flex flex-col">
            <!-- Chat Header -->
            <div id="chat-header" class="p-6 border-b border-slate-200 hidden">
                <div class="flex items-center space-x-4">
                    <img id="chat-user-avatar" src="" alt="" class="w-10 h-10 rounded-full">
                    <div>
                        <h3 id="chat-user-name" class="font-semibold text-slate-900"></h3>
                        <p id="chat-user-status" class="text-sm text-slate-500"></p>
                    </div>
                </div>
            </div>

            <!-- Messages Area -->
            <div class="flex-1 overflow-y-auto p-6" id="messages-area">
                <div id="welcome-state" class="text-center py-20">
                    <i data-lucide="message-circle" class="w-16 h-16 mx-auto text-slate-400 mb-4"></i>
                    <h3 class="text-xl font-semibold text-slate-600 mb-2">Welcome to Messages</h3>
                    <p class="text-slate-500">Select a conversation to start messaging</p>
                </div>
                <div id="messages-container" class="hidden space-y-4">
                    <!-- Messages will be loaded here -->
                </div>
            </div>

            <!-- Message Input -->
            <div id="message-input-area" class="p-6 border-t border-slate-200 hidden">
                <div class="flex space-x-4">
                    <input type="text" id="message-input" placeholder="Type your message..." class="flex-1 px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button id="send-message-btn" class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 transition">
                        <i data-lucide="send" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='messaging.js') }}"></script>
{% endblock %}
